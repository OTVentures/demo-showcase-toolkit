name: Validate toolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_release.py
      - name: Validate Claude Code plugin and marketplace
        run: |
          npx --yes --package @anthropic-ai/claude-code@2.1.280 claude plugin validate . --strict
          npx --yes --package @anthropic-ai/claude-code@2.1.280 claude plugin validate plugins/demo-showcase-toolkit --strict
      - run: python scripts/package_release.py
